name: AVCU Workflow Quality
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: avcu-workflow-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend runtime dependencies
        run: npm install --no-package-lock --no-audit --no-fund && npm run build:auth
      - name: Validate JavaScript syntax and workflow regression tests
        run: npm run check
      - name: Install Chromium for browser audit
        run: cd tests/browser && npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run member and operator browser audit on desktop and mobile
        run: cd tests/browser && npx playwright test
