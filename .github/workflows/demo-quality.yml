name: AVCU Demo Quality
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: avcu-demo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax and demo smoke tests
        run: npm run check
