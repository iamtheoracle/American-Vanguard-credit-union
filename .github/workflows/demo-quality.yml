name: AVCU Quality Checks
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: avcu-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avcu
          POSTGRES_PASSWORD: avcu
          POSTGRES_DB: avcu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avcu -d avcu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://avcu:avcu@127.0.0.1:5432/avcu
      AVCU_TEST_ADMIN_URL: postgres://avcu:avcu@127.0.0.1:5432/avcu
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run demo smoke tests
        run: npm test
      - name: Run API integration tests
        run: npm run test:api
