name: AVCU disposable ledger migration verification
on:
  push:
    branches:
      - "fix/avcu-pr20-dollar-quoting"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  apply-ledger-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avcu
          POSTGRES_PASSWORD: avcu
          POSTGRES_DB: avcu_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avcu -d avcu_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://avcu:avcu@127.0.0.1:5432/avcu_migration_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision Supabase-compatible disposable roles and auth stub
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE ROLE avcu_provider_verifier NOLOGIN NOSUPERUSER NOBYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $fn$
              SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
            $fn$;
          SQL
      - name: Apply every PR #20 migration in order
        run: |
          for migration in supabase/migrations/202610310001_member_identity_foundation.sql supabase/migrations/202610310002_banking_foundation.sql supabase/migrations/202610310003_jurisdiction_controls.sql supabase/migrations/202610310004_ledger_posting_controls.sql supabase/migrations/202610310005_provider_event_worker.sql supabase/migrations/202610310006_privilege_hardening.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify actual AVCU schema, RLS, and corrected ledger function
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            table_count integer;
            missing_rls integer;
            missing_force_rls integer;
            bad_acl integer;
            function_body text;
          BEGIN
            SELECT count(*) INTO table_count
            FROM information_schema.tables
            WHERE table_schema='public' AND table_name IN (
              'member_profiles','avcu_financial_accounts','avcu_ledger_accounts',
              'avcu_ledger_transactions','avcu_ledger_entries','avcu_provider_events',
              'avcu_jurisdictions','avcu_product_authorizations','avcu_provider_routes',
              'avcu_ledger_audit_events','avcu_provider_event_conflicts'
            );
            IF table_count <> 11 THEN
              RAISE EXCEPTION 'Expected 11 canonical AVCU tables, found %', table_count;
            END IF;
            SELECT count(*) INTO missing_rls
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public'
              AND c.relname IN (
                'member_profiles','avcu_financial_accounts','avcu_ledger_accounts',
                'avcu_ledger_transactions','avcu_ledger_entries','avcu_provider_events',
                'avcu_jurisdictions','avcu_product_authorizations','avcu_provider_routes',
                'avcu_ledger_audit_events','avcu_provider_event_conflicts'
              )
              AND (NOT c.relrowsecurity OR NOT c.relforcerowsecurity);
            IF missing_rls <> 0 THEN
              RAISE EXCEPTION 'RLS or FORCE RLS missing from % canonical AVCU tables', missing_rls;
            END IF;
            SELECT count(*) INTO bad_acl
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            CROSS JOIN LATERAL aclexplode(COALESCE(c.relacl,acldefault('r',c.relowner))) a
            WHERE n.nspname='public'
              AND (c.relname LIKE 'avcu_%' OR c.relname='member_profiles')
              AND a.grantee IN (0, (SELECT oid FROM pg_roles WHERE rolname='anon'),
                (SELECT oid FROM pg_roles WHERE rolname='authenticated'))
              AND NOT (c.relname='member_profiles'
                AND a.grantee=(SELECT oid FROM pg_roles WHERE rolname='authenticated')
                AND a.privilege_type='SELECT');
            IF bad_acl <> 0 THEN
              RAISE EXCEPTION 'Unexpected PUBLIC/browser table ACL entries remain: %', bad_acl;
            END IF;
            SELECT count(*) INTO bad_acl
            FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
            CROSS JOIN LATERAL aclexplode(COALESCE(p.proacl,acldefault('f',p.proowner))) a
            WHERE n.nspname='public' AND p.proname LIKE 'avcu_%'
              AND a.grantee IN (0, (SELECT oid FROM pg_roles WHERE rolname='anon'),
                (SELECT oid FROM pg_roles WHERE rolname='authenticated'))
              AND a.privilege_type='EXECUTE';
            IF bad_acl <> 0 THEN
              RAISE EXCEPTION 'PUBLIC/browser function EXECUTE grants remain: %', bad_acl;
            END IF;
            SELECT count(*) INTO bad_acl
            FROM information_schema.column_privileges
            WHERE table_schema='public' AND table_name LIKE 'avcu_%'
              AND grantee IN ('PUBLIC','anon','authenticated');
            IF bad_acl <> 0 THEN
              RAISE EXCEPTION 'Unexpected browser column grants remain: %', bad_acl;
            END IF;
            SELECT count(*) INTO bad_acl
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            CROSS JOIN LATERAL aclexplode(COALESCE(c.relacl,acldefault('S',c.relowner))) a
            WHERE n.nspname='public' AND c.relkind='S'
              AND c.relname LIKE 'avcu_%'
              AND a.grantee IN (0, (SELECT oid FROM pg_roles WHERE rolname='anon'),
                (SELECT oid FROM pg_roles WHERE rolname='authenticated'));
            IF bad_acl <> 0 THEN
              RAISE EXCEPTION 'PUBLIC/browser sequence grants remain: %', bad_acl;
            END IF;
            IF has_schema_privilege('anon','public','CREATE')
               OR has_schema_privilege('authenticated','public','CREATE') THEN
              RAISE EXCEPTION 'Browser roles must not create objects in public schema';
            END IF;
            SELECT pg_get_functiondef('public.avcu_create_draft_ledger_transaction(text,text,text,text,timestamptz,jsonb,jsonb)'::regprocedure)
            INTO function_body;
            IF position('v_fingerprint' in function_body)=0 OR position('v_inserted' in function_body)=0 THEN
              RAISE EXCEPTION 'Corrected ledger draft function body was not installed';
            END IF;
            IF has_function_privilege('service_role',
              'public.avcu_mark_provider_event_verified(uuid,text)','EXECUTE') THEN
              RAISE EXCEPTION 'Shared service_role must not attest provider signature verification';
            END IF;
            IF NOT has_function_privilege('avcu_provider_verifier',
              'public.avcu_mark_provider_event_verified(uuid,text)','EXECUTE') THEN
              RAISE EXCEPTION 'Dedicated provider verifier role lacks verification capability';
            END IF;
          END
          $verify$;
          SQL

      - name: Verify provider replay evidence survives conflict handling
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT public.avcu_ingest_provider_event('ci-provider','event-1','payment.updated','{"amount":100}'::jsonb);
          SELECT public.avcu_ingest_provider_event('ci-provider','event-1','payment.updated','{"amount":101}'::jsonb);
          DO $verify$
          DECLARE conflicts integer; event_status text;
          BEGIN
            SELECT count(*) INTO conflicts FROM public.avcu_provider_event_conflicts
            WHERE provider_code='ci-provider' AND provider_event_id='event-1';
            SELECT processing_status INTO event_status FROM public.avcu_provider_events
            WHERE provider_code='ci-provider' AND provider_event_id='event-1';
            IF conflicts <> 1 OR event_status <> 'quarantined' THEN
              RAISE EXCEPTION 'Provider replay conflict evidence was not durably preserved';
            END IF;
          END
          $verify$;
          SQL
